plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.lombok" version '2.4.10'
}

group = 'org.joom'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    annotationProcessor "org.projectlombok:lombok:1.18.46"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.46"
    implementation "io.appium:java-client:10.1.1"
    implementation "org.seleniumhq.selenium:selenium-java:4.51.0"
    implementation "org.projectlombok:lombok:1.18.46"
    implementation "org.apache.logging.log4j:log4j-core:2.26.1"
    implementation "org.apache.logging.log4j:log4j-api:2.26.1"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:2.26.1"
    implementation "org.assertj:assertj-core:3.27.7"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams=true
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency {DependencyResolveDetails details ->
        if(details.requested.group == "org.slf4j"){
            details.useVersion("1.7.32")
        }
    }
}
kotlin {
    jvmToolchain(18)
}